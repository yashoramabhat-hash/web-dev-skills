name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate SKILL.md + command frontmatter
        run: node scripts/validate.mjs

  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install into a temp HOME (add-only, must not fail)
        run: |
          export HOME="$RUNNER_TEMP/fakehome"
          mkdir -p "$HOME"
          bash scripts/install.sh
          echo "--- installed tree ---"
          find "$HOME/.claude" -type f | sort
          test -f "$HOME/.claude/skills/web-dev-tools/SKILL.md"
          test -f "$HOME/.claude/commands/web.md"
          echo "install OK"

  index-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: index/ must match skills/ catalogs
        run: |
          node scripts/check-index.mjs
